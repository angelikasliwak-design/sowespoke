name: Serienmails versenden

# Cloudflare Pages Cron Triggers gibt es nur für klassische Workers, nicht
# für dieses Git-integrierte Pages-Projekt (siehe DESIGN.md, 2026-08-14).
# Deshalb übernimmt dieser Workflow die Terminierung von außen: alle 15
# Minuten wird der secret-geschützte Endpunkt /api/mail-schedule/run
# angestoßen, der fällige Serienmails verschickt.
#
# Setup (einmalig, im GitHub-Repo): Settings → Secrets and variables →
# Actions → "New repository secret" → Name MAIL_SCHEDULE_SECRET, Wert
# identisch zum gleichnamigen Secret im Cloudflare-Pages-Projekt.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Fällige Serienmails anstoßen
        run: |
          curl --fail --silent --show-error \
            -X POST "https://sowespoke.pages.dev/api/mail-schedule/run" \
            -H "Authorization: Bearer ${{ secrets.MAIL_SCHEDULE_SECRET }}"
