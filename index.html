<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="robots" content="noindex, nofollow" />

<body>

<div class="shell">

    <nav class="rail__nav" aria-label="Hauptnavigation">
      <a href="#/" data-nav="news" aria-label="Neuigkeiten" title="Neuigkeiten"><span class="rail__nav-icon"></span><span class="rail__nav-label">News</span></a>
      <a href="#/praesentationen" data-nav="praesentationen" aria-label="Präsentationen" title="Präsentationen"><span class="rail__nav-icon"></span><span class="rail__nav-label">Präsentationen</span></a>
      <a href="#/vorlagen" data-nav="vorlagen" aria-label="Vorlagen &amp; Wissensdatenbank" title="Vorlagen &amp; Wissensdatenbank"><span class="rail__nav-icon"></span><span class="rail__nav-label">Vorlagen</span></a>

      <a href="#/anfragen" data-nav="anfragen" aria-label="Anfragen an Microsoft" title="Anfragen an Microsoft"><span class="rail__nav-icon"></span><span class="rail__nav-label">Anfragen</span></a>
      <a href="#/ideen" data-nav="ideen" aria-label="Ideen &amp; Vorschläge" title="Ideen &amp; Vorschläge"><span class="rail__nav-icon"></span><span class="rail__nav-label">Ideen</span></a>
    </nav>
    <div class="rail__profile" id="rail-profile"></div>
  </aside>

  <div class="shell__main">
    <div class="page-bg" aria-hidden="true"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <footer class="site-footer">
      <p>Internes Wissenszentrum · nur für Mitarbeiter:innen · Zugriff auf Firmen-E-Mail beschränkt · <a href="#" id="logout-link">Abmelden</a></p>
    </footer>

<div id="mascot-root"></div>
