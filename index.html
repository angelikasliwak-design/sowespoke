<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sowespoke — Wissenszentrum</title>
<meta name="description" content="Internes Wissenszentrum für Online-Marketing-News, Microsoft-Präsentationen und E-Mail-Vorlagen." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="assets/brand/logo-sowespoke-vertical (1).png" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<a class="skip-link" href="#view">Zum Inhalt springen</a>

<div class="shell">
  <aside class="rail">
    <a class="rail__logo" href="#/" aria-label="Sowespoke Wissenszentrum, zur Startseite">
      <img src="assets/brand/logo-sowespoke-vertical (1).png" alt="Sowespoke" />
    </a>
    <nav class="rail__nav" aria-label="Hauptnavigation">
      <a href="#/" data-nav="news" aria-label="Neuigkeiten" title="Neuigkeiten"><span class="rail__nav-icon"></span><span class="rail__nav-label">News</span></a>
      <a href="#/praesentationen" data-nav="praesentationen" aria-label="Präsentationen" title="Präsentationen"><span class="rail__nav-icon"></span><span class="rail__nav-label">Präsentationen</span></a>
      <!-- Serienmails als aufklappbares Untermenü unter Vorlagen (2026-08-14,
           Nutzer-Wunsch) — existiert nur, weil es aus dem Mail-Generator
           innerhalb von Vorlagen entsteht. Erstes verschachteltes Nav-
           Element in dieser App, siehe app.js (wireNavSubmenu) für die
           Auf-/Zuklapp-Logik und Auto-Aufklappen auf passender Route. Auf
           Mobile (horizontale Icon-Leiste, siehe styles.css) rendert die
           Gruppe stattdessen flach — kein Platz für Einrückung/Aufklappen
           in einer schmalen Zeile. -->
      <div class="rail__nav-group" data-nav-group="vorlagen">
        <a href="#/vorlagen" data-nav="vorlagen" aria-label="Vorlagen &amp; Wissensdatenbank" title="Vorlagen &amp; Wissensdatenbank" class="rail__nav-group-link"><span class="rail__nav-icon"></span><span class="rail__nav-label">Vorlagen</span></a>
        <button type="button" class="rail__nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="rail-nav-sub-vorlagen" aria-label="Untermenü Vorlagen ein-/ausblenden"></button>
        <div class="rail__nav-sub" id="rail-nav-sub-vorlagen" data-nav-sub>
          <a href="#/serienmails" data-nav="serienmails" aria-label="Geplante Serienmails" title="Geplante Serienmails"><span class="rail__nav-icon"></span><span class="rail__nav-label">Serienmails</span></a>
        </div>
      </div>
      <a href="#/case-studies" data-nav="case-studies" aria-label="Case Studies" title="Case Studies"><span class="rail__nav-icon"></span><span class="rail__nav-label">Case Studies</span></a>
      <a href="#/tickets" data-nav="tickets" aria-label="Tickets" title="Tickets"><span class="rail__nav-icon"></span><span class="rail__nav-label">Tickets</span></a>
      <a href="#/microsoft-learn" data-nav="microsoft-learn" aria-label="Von Microsoft Learn" title="Von Microsoft Learn"><span class="rail__nav-icon"></span><span class="rail__nav-label">Microsoft Learn</span></a>
      <a href="#/anfragen" data-nav="anfragen" aria-label="Anfragen an Microsoft" title="Anfragen an Microsoft"><span class="rail__nav-icon"></span><span class="rail__nav-label">Anfragen</span></a>
      <a href="#/ideen" data-nav="ideen" aria-label="Ideen &amp; Vorschläge" title="Ideen &amp; Vorschläge"><span class="rail__nav-icon"></span><span class="rail__nav-label">Ideen</span></a>
      <a href="#/microsoft-ads-kontopruefung" data-nav="microsoft-ads-kontopruefung" aria-label="Microsoft Ads Kontoprüfung" title="Microsoft Ads Kontoprüfung"><span class="rail__nav-icon"></span><span class="rail__nav-label">Kontoprüfung</span></a>
      <!-- Nur für Admins (2026-08-14) — per JS eingeblendet, siehe app.js
           (rail-profile-IIFE prüft isAdmin über /api/auth/me). Standardmäßig
           versteckt, damit nicht jedes Teammitglied einen Link auf eine
           403-Seite sieht. -->
      <a href="#/nutzer" data-nav="nutzer" aria-label="Nutzungsübersicht (nur Admins)" title="Nutzungsübersicht (nur Admins)" hidden><span class="rail__nav-icon"></span><span class="rail__nav-label">Nutzung</span></a>
    </nav>
    <div class="rail__profile" id="rail-profile"></div>
  </aside>

  <div class="shell__main">
    <div class="page-bg" aria-hidden="true"></div>
    <main id="view" class="view" tabindex="-1"></main>
    <footer class="site-footer">
      <p>Internes Wissenszentrum · nur für Mitarbeiter:innen · Zugriff auf Firmen-E-Mail beschränkt · <a href="#" id="logout-link">Abmelden</a></p>
    </footer>
  </div>
</div>

<div id="mascot-root"></div>

<!-- Selbst gehostet (kein CDN, siehe CLAUDE.md-Prinzip), MIT-lizenziert.
     Nur für die Performance-Chart-Karte auf Case-Study-Detailseiten
     gebraucht, deshalb erst kurz vor app.js statt bei den Datendateien. -->
<script src="assets/vendor/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="presentations-data.js"></script>
<script src="case-studies-data.js"></script>
<script src="tickets-data.js"></script>
<script src="microsoft-requests-data.js"></script>
<script src="calendar-events.js"></script>
<script src="fun-facts.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
